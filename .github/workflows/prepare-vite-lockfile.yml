name: Prepare Vite lockfile

on:
  push:
    branches:
      - feat/migrate-vue-cli-to-vite-2026-11-06

permissions:
  contents: write

jobs:
  prepare-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/prepare-vite-lockfile.yml
          git rm .github/workflows/prepare-vite-lockfile.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes detected."
            exit 0
          fi
          git commit -m "chore: generate Vite migration lockfile"
          git push
