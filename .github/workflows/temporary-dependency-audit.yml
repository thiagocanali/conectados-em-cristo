name: Temporary dependency audit
on:
  push:
    branches:
      - audit/dependency-report-temporary
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts --no-audit
      - name: Run npm audit and summarize
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node <<'NODE'
          const report = require('./audit-report.json');
          const meta = report.metadata?.vulnerabilities || {};
          console.log('AUDIT_SUMMARY', JSON.stringify(meta));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = (item.via || []).map(v => typeof v === 'string' ? v : {
              title: v.title, url: v.url, range: v.range, severity: v.severity
            });
            console.log('AUDIT_PACKAGE', JSON.stringify({
              name, severity: item.severity, isDirect: item.isDirect,
              range: item.range, nodes: item.nodes, fixAvailable: item.fixAvailable,
              via
            }));
          }
          NODE
