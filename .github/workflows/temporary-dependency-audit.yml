name: Temporary production dependency audit
on:
  push:
    branches:
      - audit/dependency-report-temporary
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts --no-audit
      - name: Audit production dependencies
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          node <<'NODE'
          const report = require('./audit-production.json');
          console.log('PRODUCTION_SUMMARY', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log('PRODUCTION_PACKAGE', JSON.stringify({
              name, severity: item.severity, isDirect: item.isDirect,
              range: item.range, nodes: item.nodes, fixAvailable: item.fixAvailable,
              via: item.via
            }));
          }
          NODE
