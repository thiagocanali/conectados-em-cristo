name: Validate application

on:
  push:
    branches:
      - main
      - feat/community-first-repositioning
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate npm audit report
        run: npm audit --json > npm-audit.json || true
      - name: Generate production dependency audit report
        run: npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Summarize advisories
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          console.log('Vulnerability summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}))
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              via: item.via,
              fixAvailable: item.fixAvailable
            }))
          }
          NODE
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'))
          console.log('Production-only vulnerability summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}))
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({ name, severity: item.severity, direct: item.isDirect, range: item.range, via: item.via, fixAvailable: item.fixAvailable }))
          }
          NODE
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-production.json
          retention-days: 14

  dependency-remediation-preview:
    name: Non-breaking dependency fix preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible npm audit fixes in isolated runner
        run: npm audit fix
      - name: Generate post-fix audit report
        run: npm audit --json > npm-audit-after.json || true
      - name: Validate the remediated dependency tree
        run: |
          npm run lint
          npm test
          npm run build
      - name: Publish lockfile candidate branch
        run: |
          cp package-lock.json /tmp/package-lock.json
          git fetch origin main --depth=1
          git switch -c fix/dependency-audit-remediation-2026-11-07 origin/main
          cp /tmp/package-lock.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): atualiza dependências sem breaking changes'
          git push origin HEAD:fix/dependency-audit-remediation-2026-11-07
      - name: Upload remediation preview
        uses: actions/upload-artifact@v4
        with:
          name: npm-remediation-preview
          path: |
            package.json
            package-lock.json
            npm-audit-after.json
          retention-days: 7
