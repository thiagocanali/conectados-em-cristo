name: Validate application

on:
  push:
    branches:
      - main
      - feat/community-first-repositioning
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: conectados_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conectados_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conectados_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Validate local API
        run: npm run api:check
      - name: Validate PostgreSQL migrations and repository
        run: npm run api:db:test

  public-e2e:
    name: Public browser journeys (${{ matrix.hosting }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hosting: [vercel, github-pages]
    env:
      E2E_BASE_PATH: ${{ matrix.hosting == 'vercel' && '/' || '/conectados-em-cristo/' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Validate public journeys against the production build
        run: npm run test:e2e
      - name: Keep browser report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-e2e-${{ matrix.hosting }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate npm audit report
        run: npm audit --json > npm-audit.json || true
      - name: Generate production dependency audit report
        run: npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Summarize advisories
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          console.log('Vulnerability summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}))
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              via: item.via,
              fixAvailable: item.fixAvailable
            }))
          }
          NODE
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'))
          console.log('Production-only vulnerability summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}))
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({ name, severity: item.severity, direct: item.isDirect, range: item.range, via: item.via, fixAvailable: item.fixAvailable }))
          }
          NODE
      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-production.json
          retention-days: 14
      - name: Reject high and critical dependency vulnerabilities
        run: npm audit --audit-level=high


